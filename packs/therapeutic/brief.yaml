gain: >-
  Establish whether an already-approved compound produces a durable benefit in a
  second indication
do_no_harm: >-
  exposing anyone to a risk that the existing safety record does not already cover
notes: >-
  The second clause is stricter here than in a commercial venture, and deliberately
  so. A repurposing programme inherits a known safety profile; its whole advantage is
  that it does not have to relitigate one. Any protocol that pushes outside the
  approved exposure envelope has given that advantage away and must be argued on its
  own evidence.
