[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run-engine"
version = "0.1.0"
description = "A domain-neutral engine for high-stakes decisions: governed runs, an evidence ledger the model cannot write to, a cost-ordered gate ladder, and a probability only real evidence can move."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joseph Jeffrey" }]
keywords = ["decision-support", "multi-agent", "evidence", "governance", "retrieval", "calibration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Semantic (embedding-based) dedup is optional. Without it the pipeline still
# runs -- topic dedup degrades to exact/identifier matching rather than failing.
semantic = ["numpy>=1.24"]
dev = ["pytest>=7.4"]

[project.scripts]
run-engine = "run_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
