[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-pipeline"
version = "0.1.0"
description = "A multi-agent pipeline for automating literature review and prior-art search across scholarly and patent databases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joseph Jeffrey" }]
keywords = ["research", "literature-review", "prior-art", "multi-agent", "retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Semantic (embedding-based) dedup is optional. Without it the pipeline still
# runs -- topic dedup degrades to exact/identifier matching rather than failing.
semantic = ["numpy>=1.24"]
dev = ["pytest>=7.4"]

[project.scripts]
evidence-pipeline = "evidence_pipeline.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
